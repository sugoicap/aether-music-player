name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o ./*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: cd PulsePlayer && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PulsePlayer-apk
          path: PulsePlayer/app/build/outputs/apk/debug/app-debug.apk
